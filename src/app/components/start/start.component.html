
<div fxFlexFill fxLayout="column" fxLayoutAlign="start center">

    <div class="top-bar" fxLayout="row" fxLayoutAlign="space-between start">
        <span class="mode-chip grey"><mat-icon> smartphone </mat-icon> Jeden telefon </span>
        <div class="round-status"> Lobby </div>
    </div>

    <div fxFlex fxFlexFill fxLayout="column" fxLayoutAlign="start center" class="content">
        <div class="players" fxLayout="column" fxLayoutAlign="start stretch">
            <div class="players-header" fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="12px">
                <span class="players-title"> Gracze · {{ playersCount }} </span>
                <div fxLayout="row" fxLayoutAlign="end center">
                    <button type="button" mat-icon-button aria-label="Mniej graczy"
                            [disabled]="playersCount <= minPlayers" (click)="changePlayers(-1)">
                        <mat-icon> remove </mat-icon>
                    </button>
                    <button type="button" mat-icon-button aria-label="Więcej graczy"
                            [disabled]="playersCount >= maxPlayers" (click)="changePlayers(1)">
                        <mat-icon> add </mat-icon>
                    </button>
                </div>
            </div>
            <div class="players-card">
                <div *ngFor="let player of playerIds" class="player" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px">
                    <span class="player-number grey"> {{ player }} </span>
                    <input class="name-input" fxFlex type="text" autocomplete="off" enterkeyhint="next"
                           [attr.aria-label]="'Imię gracza ' + player"
                           [placeholder]="'Gracz ' + player" [attr.maxlength]="maxNameLength"
                           [value]="nameOf(player)" (input)="setName(player, $any($event.target).value)">
                </div>
            </div>
        </div>
    </div>

    <div class="action-row" fxLayout="row" fxLayoutAlign="end center">
        <button type="button" mat-stroked-button class="action-button" (click)="openSettings()">
            <mat-icon> tune </mat-icon> Ustawienia gry
        </button>
    </div>

    <div fxFlex="10" fxFlexFill fxLayout="row" fxLayoutAlign="space-between center">
        <button class="fab" mat-fab color="secondary" aria-label="Wróć" (click)="back()">
          <mat-icon> arrow_back </mat-icon>
        </button>
        <button mat-flat-button class="bottom-button" color="primary" (click)="start()"> Start </button>
    </div>

</div>
